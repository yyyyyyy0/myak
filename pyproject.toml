[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myak"
version = "0.3.0"
description = "Persistent memory for Claude Code — auto-index sessions, FTS5 search, Obsidian export"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6", "fastembed>=0.5"]

[tool.setuptools.packages.find]
include = ["myak*"]

[tool.setuptools.package-data]
myak = ["templates/*"]

[project.scripts]
myak = "myak.cli:main"
myak-index = "myak.indexer:main"
myak-query = "myak.query:main"
myak-backfill = "myak.backfill:main"
myak-export = "myak.export_obsidian:main"
myak-mcp = "myak.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "coverage[toml]>=7.0",
    "ruff>=0.4",
    "sqlite-vec>=0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=myak --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["myak"]
omit = ["myak/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
# fastembed 0.9.0 pins pillow<13, which carries known vulnerabilities (fixed in 13.0.0).
# myak only uses fastembed's text embeddings, not image features. Remove once fastembed lifts the cap.
# Repo-side only: not written into the wheel metadata, so `pip install myak[vec]` still resolves pillow<13.
override-dependencies = ["pillow>=13.0.0"]
